name: CONVET PULSE Cross-Platform Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. WINDOWS DESKTOP RELEASE (NSIS Installer + Updater Bundle)
  # ============================================================
  release-windows:
    name: Build & Release Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify Firebase Environment Configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID || vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
        run: node scripts/verify-firebase-env.mjs --platform=windows

      - name: Build and release Windows Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID || vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "CONVET PULSE ${{ github.ref_name }}"
          releaseBody: "Official cross-platform release for CONVET PULSE. Download installers below."
          releaseDraft: false
          prerelease: false
          args: --bundles nsis

  # ============================================================
  # 2. ANDROID APK RELEASE (Signed Universal Release APK)
  # ============================================================
  release-android:
    name: Build & Release Android APK
    needs: release-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager 2>/dev/null || true)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager executable not found in Android SDK installation"
            exit 1
          fi

          echo "Installing Android NDK 26.3.11579264 via $SDKMANAGER..."
          yes | "$SDKMANAGER" --install "ndk;26.3.11579264"

          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          fi

          if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
            echo "::error::Android NDK installation failed; directory does not exist."
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Successfully installed and configured Android NDK at: $NDK_PATH"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Validate Android Signing Secrets
        id: check-secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          MISSING_SECRETS=""
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then MISSING_SECRETS="${MISSING_SECRETS} ANDROID_KEYSTORE_BASE64"; fi
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then MISSING_SECRETS="${MISSING_SECRETS} ANDROID_KEYSTORE_PASSWORD"; fi
          if [ -z "$ANDROID_KEY_ALIAS" ]; then MISSING_SECRETS="${MISSING_SECRETS} ANDROID_KEY_ALIAS"; fi
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then MISSING_SECRETS="${MISSING_SECRETS} ANDROID_KEY_PASSWORD"; fi

          if [ -n "$MISSING_SECRETS" ]; then
            echo "::error::Required Android release secrets are missing:${MISSING_SECRETS}. Refusing to publish an unsigned APK."
            exit 1
          fi
          echo "All required Android release signing credentials verified."

      - name: Decode Keystore to Secure Runner Temp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore file is empty or corrupted."
            exit 1
          fi
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore securely written to isolated runner temp with 0600 permissions."

      - name: Verify Firebase Environment Configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID || vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
        run: node scripts/verify-firebase-env.mjs --platform=android

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_ID || vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
        run: |
          npx tauri android build --apk

      - name: Verify Signed APK Signature & Certificate Fingerprint
        id: verify-apk
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # 1. Locate release APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' ! -name "*unsigned*" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::No valid signed release APK found in build outputs directory."
            find src-tauri/gen/android/app/build/outputs/apk/ -type f || true
            exit 1
          fi
          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            echo "::error::Discovered APK is marked unsigned ($APK_PATH). Aborting."
            exit 1
          fi
          echo "Found candidate release APK: $APK_PATH"

          # 2. Locate apksigner
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner binary not found or not executable in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using Android SDK apksigner: $APKSIGNER"

          # 3. Cryptographically verify APK signature integrity
          echo "Verifying cryptographic APK signature integrity..."
          "$APKSIGNER" verify --verbose "$APK_PATH"

          # 4. Extract APK certificate SHA-256 fingerprint
          APK_CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK_PATH" | grep -i "SHA-256 digest" | head -n 1 | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')
          if [ -z "$APK_CERT_SHA256" ]; then
            echo "::error::Failed to extract certificate SHA-256 fingerprint from APK."
            exit 1
          fi

          
          # 5. Extract expected certificate SHA-256 fingerprint
          CERT_FILE="$RUNNER_TEMP/release-cert.der"

          if ! keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$CERT_FILE"; then
            echo "::error::Unable to export release certificate."
            exit 1
          fi

          KEYSTORE_CERT_SHA256=$(sha256sum "$CERT_FILE" | awk '{print $1}')
          rm -f "$CERT_FILE"

          # 6. Strict equality comparison of certificate fingerprints
          if [ "$KEYSTORE_CERT_SHA256" != "$APK_CERT_SHA256" ]; then
            echo "::error::Certificate fingerprint mismatch! The APK was signed with an unexpected certificate."
            exit 1
          fi
          echo "Verified: APK is signed with the authentic release certificate."

          # 7. Standardize asset filename for GitHub Release
          STANDARDIZED_NAME="CONVET_PULSE_${TAG_NAME}_android.apk"
          cp "$APK_PATH" "$STANDARDIZED_NAME"
          echo "RELEASE_APK_FILE=$STANDARDIZED_NAME" >> $GITHUB_ENV
          echo "APK successfully staged as $STANDARDIZED_NAME"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          echo "Uploading $RELEASE_APK_FILE to GitHub Release $TAG_NAME..."
          gh release upload "$TAG_NAME" "$RELEASE_APK_FILE" --clobber
          echo "Android APK successfully attached to release $TAG_NAME."

      - name: Cleanup Temporary Signing Files
        if: always()
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          CERT_PATH="$RUNNER_TEMP/release-cert.der"

          rm -f "$KEYSTORE_PATH"
          rm -f "$CERT_PATH"

          echo "Temporary signing files removed."