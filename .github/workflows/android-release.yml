
name: CONVET PULSE Android-Only Release

on:
  push:
    branches:
      - enable-tauri-updater-artifacts-v1.0.1
    paths:
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

jobs:
  release-android:
    name: Build & Release Signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Fix Branch
        uses: actions/checkout@v4
        with:
          ref: enable-tauri-updater-artifacts-v1.0.1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager --install "ndk;26.3.11579264"

          NDK_PATH="$ANDROID_HOME/ndk/26.3.11579264"

          if [ ! -d "$NDK_PATH" ]; then
            echo "::error::Android NDK installation failed."
            exit 1
          fi

          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust Stable with Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Dependencies
        run: npm ci

      - name: Validate Android Signing Secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for SECRET_NAME in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!SECRET_NAME}" ]; then
              echo "::error::Missing required secret: $SECRET_NAME"
              exit 1
            fi
          done

          echo "All Android signing secrets are present."

      - name: Decode Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore is empty or invalid."
            exit 1
          fi

          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx tauri android build --apk

      - name: Verify Signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk \
            -type f -path '*/release/*.apk' ! -name '*unsigned*' | head -n 1)

          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::Signed release APK not found."
            find src-tauri/gen/android/app/build/outputs/apk -type f || true
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose "$APK_PATH"

          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK_PATH" \
            | grep -i "SHA-256 digest" | head -n 1 \
            | awk '{print $NF}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')

          keytool -exportcert \
            -alias "$ANDROID_KEY_ALIAS" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file "$RUNNER_TEMP/release-cert.der"

          KEYSTORE_CERT=$(sha256sum "$RUNNER_TEMP/release-cert.der" \
            | awk '{print $1}')

          rm -f "$RUNNER_TEMP/release-cert.der"

          if [ -z "$APK_CERT" ] || [ "$APK_CERT" != "$KEYSTORE_CERT" ]; then
            echo "::error::APK signing certificate verification failed."
            exit 1
          fi

          echo "APK signature and release certificate verified."

          cp "$APK_PATH" "CONVET_PULSE_v1.0.1_android.apk"
          echo "RELEASE_APK_FILE=CONVET_PULSE_v1.0.1_android.apk" >> "$GITHUB_ENV"

      - name: Upload APK to Existing v1.0.1 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.1 "$RELEASE_APK_FILE" --clobber
          echo "Android APK uploaded successfully."

      - name: Cleanup Signing Files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          rm -f "$RUNNER_TEMP/release-cert.der"
