[package]
name = "convet-pulse"
version = "1.0.0"
description = "CONVET PULSE — Cross-Platform File Conversion & Developer Utility Suite"
authors = ["CONVET PULSE Team"]
edition = "2021"

[lib]
name = "convet_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
